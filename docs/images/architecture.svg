<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f5a623"/></marker>
  </defs>
  <rect width="1200" height="430" fill="#1b1e22"/>
  <text x="30" y="40" fill="#fff" font-size="22" font-weight="700">RoadSense AI - data flow</text>
  <text x="30" y="62" fill="#8a9099" font-size="13">One physical sensor unit; additional vehicles are simulated by a script (dashed).</text>

  <!-- sensors -->
  <rect x="30" y="100" width="170" height="70" rx="10" fill="#262a30" stroke="#3a3f46"/>
  <text x="115" y="128" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">MPU6050</text>
  <text x="115" y="148" fill="#c8cdd3" font-size="12" text-anchor="middle">accelerometer, I2C 0x68</text>
  <text x="115" y="163" fill="#8a9099" font-size="11" text-anchor="middle">SDA 21 / SCL 22</text>

  <rect x="30" y="210" width="170" height="70" rx="10" fill="#262a30" stroke="#3a3f46"/>
  <text x="115" y="238" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">NEO-6M GPS</text>
  <text x="115" y="258" fill="#c8cdd3" font-size="12" text-anchor="middle">NMEA, UART 9600</text>
  <text x="115" y="273" fill="#8a9099" font-size="11" text-anchor="middle">TX to 16 / RX to 17</text>

  <!-- esp32 -->
  <rect x="270" y="95" width="250" height="190" rx="12" fill="#262a30" stroke="#f5a623" stroke-width="1.5"/>
  <text x="395" y="124" fill="#f5a623" font-size="16" font-weight="700" text-anchor="middle">ESP32 firmware</text>
  <text x="395" y="150" fill="#c8cdd3" font-size="12.5" text-anchor="middle">magnitude = sqrt(ax2+ay2+az2)</text>
  <text x="395" y="170" fill="#c8cdd3" font-size="12.5" text-anchor="middle">deltaG = |magnitude - previous|</text>
  <text x="395" y="190" fill="#c8cdd3" font-size="12.5" text-anchor="middle">trigger if deltaG &gt; 0.30</text>
  <text x="395" y="210" fill="#c8cdd3" font-size="12.5" text-anchor="middle">3 s cooldown between events</text>
  <text x="395" y="230" fill="#c8cdd3" font-size="12.5" text-anchor="middle">severity 1-5 from deltaG (rules)</text>
  <text x="395" y="258" fill="#8a9099" font-size="11.5" text-anchor="middle">rule-based; trained ML is on the roadmap</text>

  <!-- firebase -->
  <rect x="610" y="115" width="220" height="150" rx="12" fill="#262a30" stroke="#3a3f46"/>
  <text x="720" y="145" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Firebase Realtime DB</text>
  <text x="720" y="170" fill="#c8cdd3" font-size="12.5" text-anchor="middle">POST /potholes.json</text>
  <text x="720" y="192" fill="#8a9099" font-size="11.5" text-anchor="middle">deltaG, severity, latitude,</text>
  <text x="720" y="208" fill="#8a9099" font-size="11.5" text-anchor="middle">longitude, satellites, timestamp</text>
  <text x="720" y="236" fill="#8a9099" font-size="11.5" text-anchor="middle">(+ source: "simulator" if simulated)</text>

  <!-- dashboard -->
  <rect x="920" y="95" width="250" height="190" rx="12" fill="#262a30" stroke="#f5a623" stroke-width="1.5"/>
  <text x="1045" y="124" fill="#f5a623" font-size="16" font-weight="700" text-anchor="middle">Web dashboard</text>
  <text x="1045" y="150" fill="#c8cdd3" font-size="12.5" text-anchor="middle">polls every 2 s (REST GET)</text>
  <text x="1045" y="170" fill="#c8cdd3" font-size="12.5" text-anchor="middle">groups reports into ~11 m cells</text>
  <text x="1045" y="190" fill="#c8cdd3" font-size="12.5" text-anchor="middle">confidence = 30% + 35% per extra</text>
  <text x="1045" y="210" fill="#c8cdd3" font-size="12.5" text-anchor="middle">report (max 100%); verified at 65%+</text>
  <text x="1045" y="236" fill="#c8cdd3" font-size="12.5" text-anchor="middle">map + table + severity chart</text>
  <text x="1045" y="262" fill="#8a9099" font-size="11.5" text-anchor="middle">validates every record it reads</text>

  <!-- simulator -->
  <rect x="610" y="330" width="220" height="60" rx="10" fill="#1b1e22" stroke="#8a9099" stroke-dasharray="6 5"/>
  <text x="720" y="356" fill="#c8cdd3" font-size="14" font-weight="700" text-anchor="middle">simulate_vehicles.py</text>
  <text x="720" y="376" fill="#8a9099" font-size="11.5" text-anchor="middle">synthetic reports, same schema</text>

  <!-- arrows -->
  <path d="M200,135 L270,155" stroke="#f5a623" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M200,245 L270,225" stroke="#f5a623" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M520,190 L610,190" stroke="#f5a623" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="565" y="180" fill="#8a9099" font-size="11" text-anchor="middle">Wi-Fi 2.4G</text>
  <path d="M830,190 L920,190" stroke="#f5a623" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M720,330 L720,265" stroke="#8a9099" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ah)"/>
</svg>
